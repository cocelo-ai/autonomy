autonomy_light:
  ros__parameters:
    ros_domain_id: 0

    # Calibrated static chain. Super-LIO publishes map -> odom -> imu.
    # The launcher publishes imu -> base_link and base_link -> lidar_link/camera_link.
    target_frame: "base_link"
    imu_frame: "imu"
    lidar_frame: "lidar_link"
    map_frame: "map"
    odom_frame: "odom"
    target_to_lidar_xyz: [0.234, 0.0, 0.077]
    target_to_lidar_rpy: [0.0, 0.7854, 0.0]
    # Provisional D435 mount. Replace with a measured T_base_camera before
    # using camera observations for locomotion or navigation.
    camera_frame: "camera_link"
    target_to_camera_xyz: [0.18, 0.0, 0.18]
    target_to_camera_rpy: [0.0, 0.7854, 0.0]
    # Two D435i units are connected. Pin the elevation camera by its physical
    # USB topology, not by serial number or nondeterministic auto-selection.
    realsense:
      enabled: true
      # Fuse the connected D435 point cloud with the LiDAR elevation map.
      # launch.sh starts the LiDAR mapper first, then brings up this source.
      use_for_elevation_mapping: true
      camera_name: "camera"
      camera_namespace: "camera"
      # Matches autonomy's known-good front-camera binding (D435i at 2-1.1).
      usb_port_id: "2-1.1"
      pointcloud_topic: "/camera/camera/depth/color/points"
      # 30 Hz keeps the combined RGB+Depth stream stable on the Jetson USB bus.
      depth_profile: "848x480x30"
      # Reduce depth at the camera before transport/fusion.  One point per
      # roughly 5 cm native map cell is sufficient and preserves 50 Hz map
      # publication under concurrent LiDAR updates.
      depth_decimation: 3
      enable_color: true
      color_profile: "640x480x30"
      # Super-LIO already owns the calibrated Livox IMU.  The D435 IMU is not
      # needed for depth point clouds and keeping it off avoids an unnecessary
      # USB stream on the elevation-camera branch.
      enable_imu: false
    # T_imu_lidar: keep this identical to the calibrated Super-LIO extrinsic.
    imu_from_lidar_xyz: [-0.011, -0.02329, 0.04412]
    imu_from_lidar_rpy: [0.0, 0.0, 0.0]

    livox_publish_freq: 50.0
    raw_lidar_topic: "/livox/lidar"
    raw_imu_topic: "/livox/imu"
    super_lio_config_file: ""

    # Direct Cyclone DDS transport for a remote height-map consumer. This is
    # deliberately a different subnet from the bundled Livox network
    # (192.168.1.0/24). Set interface to the computer-link NIC, never the
    # Livox sensor NIC. launch.sh adds local_ip only when it is absent.
    dds_network:
      mode: "wireless"  # wired | wireless
      interface: "wlP1p1s0"
      local_ip: "192.168.8.123/24"
      peer_ip: "192.168.8.120"
      allow_multicast: true

    # Guardrail for the direct DDS network. Keep this equal to the subnet
    # used by the active Livox driver profile. Fill interface once the Livox
    # NIC name is known; launcher then rejects accidental NIC reuse.
    livox_network:
      interface: "enP8p1s0"
      subnet: "192.168.1.0/24"

    # Compatibility output for controllers that consume the previous compact
    # height_map_data array rather than grid_map_msgs/GridMap. The bridge rate
    # follows elevation_mapping.fused_map_publishing_rate; it is configured
    # only in elevation_mapping.yaml to keep one cadence authority.
    height_map_output:
      # Keep ROS output deterministic; the optional direct DDS writer can be
      # enabled explicitly once its participant is configured independently.
      transport: "ros2"  # ros2 | cyclone_dds | both
      ros2_topic: "/autonomy_light/height_map_data"
      # Controller/output ROI, independent of the larger native fusion ROI
      # in elevation_mapping.yaml. This keeps the established 18 x 8 / 10 cm
      # contract around the robot.
      sampling:
        resolution: 0.10
        x_length: 1.80
        y_length: 0.80
      # PointCloud2 of the sampled native terrain. Its xyz overlays the
      # elevation GridMap; intensity carries clipped height_map_data. Every
      # cell, including the configured unknown fallback, is represented.
      pointcloud_topic: "/autonomy_light/height_map"
      distance:
        reference_height: 0.48
        min: 0.0
        max: 0.75
        unknown: 0.48
      floor:
        radius_m: 0.60
        percentile: 0.20
      cyclone_dds:
        domain_id: 1
        topic: "height_map"
        type: "core_dds::HeightMap"
        # Existing autonomy's direct DDS writer used KEEP_LAST 128.
        history_depth: 128
