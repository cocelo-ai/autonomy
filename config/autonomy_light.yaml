autonomy_light:
  ros__parameters:
    # Frames and LiDAR poses.
    target_frame: "base_link"
    height_map_frame: "base_link_gravity"
    lidar_frame: "lidar_link"
    lidar2_frame: "lidar2_link"

    # LiDAR 1 pose in target_frame. Used directly in the single-LiDAR path.
    target_to_lidar_xyz: [0.038335, 0.00162081, 0.138986]
    target_to_lidar_rpy: [3.1416, 0.0, 0.0]

    # LiDAR 2 pose in target_frame. Used only when raw_lidar2_topic is set.
    target_to_lidar2_xyz: [0.038335, 0.00162081, 0.138986]
    target_to_lidar2_rpy: [3.1416, 0.0, 0.0]

    # User-facing setup: robot-centric elevation map geometry.
    elevation_resolution: 0.01
    elevation_x_length: 1.6
    elevation_y_length: 0.8
    height_origin:
      # local_floor keeps the height map from riding on small odom z jitter caused by roll/pitch.
      # Use odom for the old behavior, or fixed for a map-level z origin.
      mode: "local_floor"
      fixed_z: 0.0
      # The global-map floor estimate is intentionally low-pass filtered to
      # prevent small Point-LIO z jitter from moving the entire height surface.
      filter_alpha: 0.18
      max_step: 0.015
      floor_radius: 0.6
      floor_percentile: 0.20
      floor_min_points: 20
    publish_rate_hz: 50.0

    # Offline mapping mode. Normally leave these false/default and use
    # ./mapping.sh, which overrides them at runtime.
    mapping_only: false
    # Set only by mapping.sh. In mapping-only mode this enables the refined
    # global-map accumulator and writes that precision map on shutdown.
    mapping_refined_pcd_file: ""
    # Offline full-SLAM refinement used by mapping.sh. Point-LIO supplies the
    # high-rate local odometry; loop closures are verified before a 4-DoF
    # (XYZ + yaw) pose-graph optimization reconstructs the final refined PCD.
    # IMU roll/pitch are deliberately retained from Point-LIO for stability.
    mapping_slam:
      enabled: true
      keyframe_distance_m: 0.5
      keyframe_yaw_deg: 7.5
      keyframe_voxel_leaf_size: 0.03
      keyframe_max_points: 15000
      scan_context:
        rings: 20
        sectors: 60
        max_radius: 40.0
        max_distance: 0.18
        candidate_count: 10
      loop:
        min_keyframe_separation: 30
        # Verify every fifth keyframe; keyframes remain 0.5 m apart, so this
        # still tests loop opportunities about every 2.5 m without making
        # shutdown optimization unnecessarily slow.
        query_stride: 5
        submap_neighbors: 3
        voxel_leaf_size: 0.05
        max_correspondence_distance: 0.75
        max_fitness: 0.025
        min_inlier_fraction: 0.35
      optimizer_iterations: 20
      loop_weight: 20.0
    point_lio_pcd_save_en: false
    point_lio_pcd_save_interval: -1
    child_shutdown_grace_sec: 0.8
    saved_map_file: ""
    # Global map frame. `map -> odom` is published after runtime localization.
    saved_map_frame: "map"
    saved_map_topic: "/autonomy_light/saved_map"
    # Voxel size for the latched RViz/debug copy of the saved map.
    saved_map_publish_voxel_leaf_size: 0.10
    # Re-publish on the map-visualization domain so RViz can attach after launch
    # even when its QoS durability is left at the default.
    saved_map_republish_interval_sec: 2.0
    # When saved_map_file is set, estimate map_from_odom from Point-LIO's
    # registered scan.  A global FPFH/RANSAC candidate is refined by GICP, then
    # later scans use GICP around the last accepted pose for accurate tracking.
    saved_map_localization:
      enabled: true
      global_initialization: true
      # Only for the coarse global initialization. Steady tracking uses the
      # independent runtime_localization cadence below.
      update_interval_sec: 1.0
      # Accumulate registered scans in Point-LIO's odom frame before the first
      # global search. Moving through the scene during this window gives the
      # initializer substantially more stable geometry than one scan.
      initial_submap_duration_sec: 2.0
      initial_submap_min_points: 500
      initial_submap_max_points: 30000
      scan_voxel_leaf_size: 0.05
      map_voxel_leaf_size: 0.05
      # FPFH/RANSAC is only a coarse global initializer. Run it on a bounded
      # 15 cm representation, then retain the 5 cm clouds for precise GICP.
      global_feature_voxel_leaf_size: 0.15
      global_feature_max_points: 6000
      global_source_max_points: 6000
      normal_radius: 0.45
      feature_radius: 0.75
      global_max_iterations: 1500
      global_inlier_fraction: 0.20
      max_correspondence_distance: 0.75
      gicp_max_iterations: 50
      max_fitness: 0.01
      max_tracking_translation_step: 1.0
      min_scan_points: 80
    # Low-rate global correction. Point-LIO stays the high-rate odom source;
    # With a saved map this aligns a rolling submap to the immutable map. Without
    # a map, Scan Context + verified loop closures update map -> odom instead of
    # continuously registering against the node's own growing live map.
    runtime_localization:
      enabled: true
      update_interval_sec: 1.0
      submap_duration_sec: 5.0
      submap_voxel_leaf_size: 0.05
      submap_max_points: 60000
      target_radius_m: 15.0
      filter_alpha: 0.20
      max_translation_innovation_m: 0.50
      max_yaw_innovation_deg: 5.0

    # ROS 2 domain split: keep heavy perception internal, publish only control-facing
    # outputs on the external domain. point_lio_global_map.ros_domain_id below
    # independently selects the RViz/debug domain for the refined global map.
    internal_ros_domain_id: 0
    external_ros_domain_id: 0
    
    # Livox driver setup.
    livox_model: "mid360"

    # LiDAR 1: default single-LiDAR path. For one physical LiDAR, only these
    # fields need to be set.
    livox_interface: "enP8p1s0"
    livox_host_ip: "192.168.1.50/24" 
    livox_lidar_ip: "192.168.1.166"

    # LiDAR 2: optional. Set livox_lidar2_ip to start a second Livox driver.
    # If LiDAR 2 is connected through USB-to-Ethernet, put that interface here
    # and give it a different host IP such as 192.168.2.50/24.
    # Leave livox_lidar2_ip empty to keep the existing single-LiDAR behavior.
    livox2_interface: ""
    livox_lidar2_ip: ""
    livox_host2_ip: ""

    # Raw Livox topics.
    # - Single LiDAR keeps the existing Livox topics: livox/lidar, livox/imu.
    # - When livox_lidar2_ip is set, launch.sh automatically uses /livox1/*
    #   and /livox2/* unless these topics are explicitly overridden.
    # - Point-LIO always uses LiDAR 1 IMU; LiDAR 2 IMU is exposed only for
    #   inspection/debugging.
    raw_lidar_topic: "livox/lidar"
    raw_lidar2_topic: ""
    raw_lidar_msg_type: "livox_custom"
    raw_imu_topic: "livox/imu"
    raw_imu2_topic: "/livox2/imu"
    monitor_raw_lidar: false

    # Two-LiDAR merge output. Enabled only when raw_lidar2_topic is non-empty.
    # Both clouds are transformed into target_frame before Point-LIO sees them.
    merged_lidar_topic: "/autonomy_light/merged_lidar"
    lidar_merge:
      sync_tolerance: 0.005
      max_queue_size: 8
      publish_lidar1_on_sync_miss: false
    point_lio_odom_topic: "/aft_mapped_to_init"
    point_lio_path_topic: "/path"
    point_lio_registered_topic: "/cloud_registered"
    # Full trajectory map built from Point-LIO registered scans. This is the
    # only live source used to construct the height map.
    point_lio_global_map:
      enabled: true
      topic: "/point_lio/global_map"
      # Refined, edge-preserving surfel map. This is the live map used for
      # height extraction; publish it as a separate RViz topic to compare with
      # the lighter raw visualization map above.
      refined_topic: "/point_lio/global_map_refined"
      # Change this ID to view only the global map from a separate RViz domain.
      # For example: ROS_DOMAIN_ID=17 rviz2
      ros_domain_id: 0
      use_for_height_map: true
      height_voxel_leaf_size: 0.01
      height_max_points: 4000000
      voxel_leaf_size: 0.05
      publish_interval_sec: 1.0
      max_points: 500000
      # RViz copy of the high-resolution refined map. The internal height-map
      # store remains at height_voxel_leaf_size (1 cm).
      refined_visual_voxel_leaf_size: 0.02
      refined_visual_max_points: 1500000
      refinement:
        # Per registered scan: discard statistically isolated returns before
        # centimetre-level surfel fusion. This removes flying points without
        # fitting across stair edges.
        mean_k: 16
        stddev_multiplier: 0.8
    odom_output_topic: "/autonomy_light/odom"
    height_map_topic: "/autonomy_light/height_map"
    height_map_msg_topic: "/autonomy_light/height_map_data"
    # Keep this distinct from point_lio_path_topic. Using the same topic in the
    # same ROS domain makes autonomy-light receive and republish its own path.
    path_output_topic: "/autonomy_light/path"
    height_map_debug:
      # When enabled, publish a constant height map for receiver/control debugging
      # without requiring Point-LIO map input. /autonomy_light/height_map_data is
      # filled directly with manual_value.
      manual_mode: false
      manual_value: 0.48
    # The source map is kept at 1 cm for terrain extraction while Point-LIO
    # observations are roughly 5 cm apart. Fill only short, level gaps.
    interpolation_max_passes: 4
    interpolation_min_neighbors: 3
    interpolation_max_height_diff: 0.02
    fill_remaining_height: 0.0
    initial_floor_seed_fill:
      # Startup-only seed for blind cells under/near the robot. It estimates floor
      # height from the ROI side band and the ring just outside the ROI, then fills
      # remaining unknown cells once before falling back to fill_remaining_height.
      enabled: true
      side_width: 0.20
      search_margin: 0.40
      cluster_band: 0.08
      lower_fraction: 0.70
    algorithm:
      # robust: existing autonomy-light selector, autonomy_min_z: autonomy MinZElevationBackend style.
      elevation_backend: "autonomy_min_z"
      clipping:
        enabled: true
        min_z: 0.0
        max_z: 0.48
      min_z:
        # Terrain requires a denser lower-surface cluster.  Sparse top-surface
        # returns are independently retained as obstacles after terrain filtering.
        min_points_per_cell: 3
        supported_min_enabled: true
        # A terrain sample must agree with nearby low returns within 2.5 cm;
        # isolated low noise no longer becomes the selected ground surface.
        support_band: 0.025
        obstacle_override_enabled: true
        obstacle_min_height: 0.035
        obstacle_min_points: 1
        obstacle_support_band: 0.06
        # Project only obstacle tops into the neighboring height-map cells so
        # Point-LIO's coarser local-map voxels still produce a continuous edge.
        obstacle_projection_radius_cells: 0
      cloud_registered_fill:
        enabled: false
        percentile: 0.15
        min_points_per_cell: 2
        # Disabled with the local registered-scan fallback. Missing cells are
        # handled from the stable global map instead.
        initial_floor_fill_enabled: false
        initial_floor_max_local_coverage: 0.25
        floor_min_points: 20
        floor_support_band: 0.08
        initial_keep_min_support: 3
      frame_aggregation:
        robust_height_gate: 0.025
        intra_cell_min_support_gap: 0.02
        intra_cell_min_support_count: 3
        edge_mix_height_diff: 0.02
        edge_prefer_prev_support_count: 0
        fill_missing_from_previous_grid: false
        cell_height_percentile: 0.15
        # Applied only to terrain; obstacle candidates are overlaid afterwards so
        # their edges do not leave temporal or spatial smoothing tails.
        temporal_alpha: 0.85
      isolated_filter:
        # Remove sparse spikes against a 5 x 5-cell neighborhood before
        # smoothing. The 2 cm compatibility test protects real edges.
        radius: 2
        min_support_neighbors: 5
        support_height_diff: 0.02
        outlier_height_diff: 0.025
        every_n_frames: 1
      hole_fill:
        radius: 2
        min_neighbors: 5
        max_height_diff: 0.02
      bilateral:
        # Smooth valid samples over 2 cm, but never average across a 2.5 cm
        # discontinuity. Obstacles are overlaid after this terrain-only stage.
        radius: 2
        sigma_spatial: 1.3
        sigma_height: 0.012
        max_height_diff: 0.025
        passes: 2
        every_n_frames: 1
    start_lidar_driver: true
    start_point_lio: true
    child_use_sim_time: false
