autonomy_light:
  ros__parameters:
    ros_domain_id: 0

    # Calibrated static chain. Super-LIO publishes map -> odom -> imu.
    # The launcher publishes imu -> base_link and base_link -> lidar_link/camera_link.
    target_frame: "base_link"
    imu_frame: "imu"
    lidar_frame: "lidar_link"
    map_frame: "map"
    odom_frame: "odom"
    target_to_lidar_xyz: [0.234, 0.0, 0.077]
    target_to_lidar_rpy: [0.0, 0.7854, 0.0]
    # Provisional D435 mount. Replace with a measured T_base_camera before
    # using camera observations for locomotion or navigation.
    camera_frame: "camera_link"
    target_to_camera_xyz: [0.18, 0.0, 0.18]
    target_to_camera_rpy: [0.0, 0.7854, 0.0]
    # T_imu_lidar: keep this identical to the calibrated Super-LIO extrinsic.
    imu_from_lidar_xyz: [-0.011, -0.02329, 0.04412]
    imu_from_lidar_rpy: [0.0, 0.0, 0.0]

    livox_publish_freq: 50.0
    raw_lidar_topic: "/livox/lidar"
    raw_imu_topic: "/livox/imu"
    super_lio_config_file: ""

    # Direct Cyclone DDS transport for a remote height-map consumer. This is
    # deliberately a different subnet from the bundled Livox network
    # (192.168.1.0/24). Set interface to the computer-link NIC, never the
    # Livox sensor NIC. launch.sh adds local_ip only when it is absent.
    dds_network:
      mode: "wireless"  # wired | wireless
      interface: "wlP1p1s0"
      local_ip: "192.168.8.123/24"
      peer_ip: "192.168.8.120"
      allow_multicast: true

    # Guardrail for the direct DDS network. Keep this equal to the subnet
    # used by the active Livox driver profile. Fill interface once the Livox
    # NIC name is known; launcher then rejects accidental NIC reuse.
    livox_network:
      interface: "enP8p1s0"
      subnet: "192.168.1.0/24"

    # Compatibility output for controllers that consume the previous compact
    # height_map_data array rather than grid_map_msgs/GridMap. The bridge rate
    # follows elevation_mapping.fused_map_publishing_rate; it is configured
    # only in elevation_mapping.yaml to keep one cadence authority.
    height_map_output:
      transport: "both"  # ros2 | cyclone_dds | both
      ros2_topic: "/autonomy_light/height_map_data"
      distance:
        reference_height: 0.48
        min: 0.0
        max: 0.75
        unknown: 0.48
      floor:
        radius_m: 0.60
        percentile: 0.20
      cyclone_dds:
        domain_id: 1
        topic: "height_map"
        type: "core_dds::HeightMap"
        # Existing autonomy's direct DDS writer used KEEP_LAST 128.
        history_depth: 128
