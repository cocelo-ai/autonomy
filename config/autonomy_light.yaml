autonomy_light:
  ros__parameters:
    ros_domain_id: 0

    # Calibrated static chain. Super-LIO publishes map -> odom -> imu.
    # The launcher publishes imu -> base_link and base_link -> lidar_link.
    target_frame: "base_link"
    imu_frame: "imu"
    lidar_frame: "lidar_link"
    map_frame: "map"
    odom_frame: "odom"
    target_to_lidar_xyz: [0.234, 0.0, 0.077]
    target_to_lidar_rpy: [0.0, 0.7854, 0.0]
    # T_imu_lidar: keep this identical to the calibrated Super-LIO extrinsic.
    imu_from_lidar_xyz: [-0.011, -0.02329, 0.04412]
    imu_from_lidar_rpy: [0.0, 0.0, 0.0]

    livox_publish_freq: 50.0
    raw_lidar_topic: "/livox/lidar"
    raw_imu_topic: "/livox/imu"
    super_lio_cloud_topic: "/lio/cloud_world"
    super_lio_odom_topic: "/lio/odom"
    super_lio_config_file: ""

    # The mapper uses native grid_map_msgs/GridMap.  A non-empty underlying
    # map topic may provide a prebuilt GridMap with an `elevation` layer.
    elevation_mapping:
      map_topic: "/autonomy_light/elevation_map"
      lidar_topic: "/lio/cloud_world"
      d435_topic: "/camera/camera/depth/color/points"
      underlying_map_topic: ""
      resolution: 0.10
      length_in_x: 1.80
      length_in_y: 0.80
      publish_rate_hz: 50.0
      visibility_cleanup_rate_hz: 10.0
      d435_enabled: true
      d435_max_depth_m: 3.25
