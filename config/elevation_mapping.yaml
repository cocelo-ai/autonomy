# F4 camera-only elevation map.  LiDAR is used only by Super-LIO/Nav2.

bringup:
  ros__parameters:
    # All perception, SLAM, TF, and Nav2 traffic remains on this private ROS
    # domain. Only outbound_command_bridge crosses into the external domain.
    internal_ros_domain_id: 10
    external_ros_domain_id: 0
    # The launcher parses this URDF and publishes only the fixed paths needed
    # for LiDAR -> base and the cameras selected below; it never starts a
    # robot model or joint-state publisher.
    urdf: resources/urdf/f4/f4.urdf
    lidar_frame: lidar_link
    base_frame: base_link
    # A camera key is also the mapper/merge source name. launch.sh starts only
    # keys selected by observation_merge.inputs.
    realsense_cameras:
      front_d435:
        name: front_d435
        namespace: front_d435
        # Observed by show_realsense_usb_ports.py (D435i, serial 243522073112).
        usb_port_id: 2-1.2
        # This name is private to realsense2_camera. Its TF publishing is
        # disabled: elevation uses the static F_camera_link TF plus the fixed
        # source_to_mount_* conversion below, so no driver-specific frames
        # appear in the global TF graph.
        driver_base_frame_id: link
        depth_profile: 640x480x60

camera_frame_mapper:
  ros__parameters:
    # Each selected source receives one mapper process. launch.sh supplies its
    # input/output topic and static sensor mount from sources.<name> below.
    map_frame: map
    base_frame: base_link
    frame_override: ""
    noise_stddev: 0.025
    min_range: 0.30
    max_range: 3.00
    max_points: 60000
    tf_timeout_sec: 0.020

gravity_frame_broadcaster:
  ros__parameters:
    # Owns the dynamic base_link -> base_link_gravity edge.  Its rotation is
    # the inverse of the instantaneous Super-LIO roll/pitch correction so
    # map -> base_link_gravity retains yaw while remaining level. Translation
    # is zero because the gravity frame shares base_link's local origin.
    map_frame: map
    base_frame: base_link
    gravity_frame: base_link_gravity
    publish_rate_hz: 50.0
    tf_timeout_sec: 0.020

observation_merge:
  ros__parameters:
    base_frame: base_link
    map_frame: map
    target_frame: base_link_gravity
    output_topic: /autonomy_light/merged_observations
    publish_rate_hz: 60.0
    # A single F camera is consumed FIFO at its input cadence.  No time cohort
    # is formed, so no valid existing frame is held for another sensor.
    max_cloud_age_sec: 0.25
    sync.require_all_sources: true
    sync.slop_sec: 0.015
    sync.queue_size: 256
    # Retained for a future multi-camera configuration.  Such a configuration
    # is explicitly cohort-synchronised; it never changes the F4 one-camera
    # passthrough behaviour below.
    sync.wait_for_complete_window: true
    sync.single_source_passthrough: true
    tf_timeout_sec: 0.020
    roi.x_min: -1.50
    roi.x_max: 1.50
    roi.y_min: -1.00
    roi.y_max: 1.00
    roi.z_min: -1.20
    roi.z_max: 0.80
    roi.max_range: 3.00
    roi.voxel_size: 0.02
    # Inputs arrive in map coordinates from their camera_frame_mapper nodes.
    # Add a mapper and a source entry for each future rear/side camera; then
    # inputs becomes an explicit cohort, with the sync settings above.
    inputs: [front_d435]
    sources.front_d435.type: camera
    sources.front_d435.mount_frame: F_camera_link
    sources.front_d435.raw_topic: /front_d435/front_d435/depth/color/points
    sources.front_d435.topic: /autonomy_light/camera_observations/front_d435_map
    sources.front_d435.frame_override: map
    sources.front_d435.validate_mount_tf: false
    # F_camera_link is already the D435 optical frame at its
    # calibrated physical mounting angle.  The raw D435 PointCloud2 uses that
    # same optical-axis convention, so this conversion must stay identity.
    # Applying the standard optical-frame rotation here would rotate it twice
    # and bend the merged observation.
    sources.front_d435.source_to_mount_xyz: [0.0, 0.0, 0.0]
    sources.front_d435.source_to_mount_rpy: [0.0, 0.0, 0.0]
    sources.front_d435.noise_stddev: 0.025
    sources.front_d435.min_range: 0.30
    sources.front_d435.max_points: 60000

elevation_mapping:
  ros__parameters:
    input_topic: /autonomy_light/merged_observations
    output_topic: /autonomy_light/elevation_map
    output_frame: base_link_gravity
    # Processing consumes every merged observation.  The most recent complete
    # grid is published at 50 Hz for DDS consumers without throttling input.
    publish_rate_hz: 50.0
    # Temporal state is reprojected through map -> base_link_gravity. Never
    # fuse unregistered history when the SLAM attitude transform is unavailable.
    slam.map_frame: map
    grid.resolution: 0.1
    grid.x_min: -0.90
    grid.x_max: 0.90
    grid.y_min: -0.40
    grid.y_max: 0.40
    grid.z_min: -1.20
    grid.z_max: 0.80
    algorithm.uncertainty.noise_alpha: 0.001
    algorithm.uncertainty.min_meas_var: 0.0004
    algorithm.uncertainty.max_cell_var: 0.0100
    algorithm.temporal.enabled: true
    algorithm.temporal.require_slam_tf: true
    algorithm.temporal.tf_timeout_sec: 0.020
    algorithm.temporal.time_variance_rate: 0.20
    algorithm.temporal.mahalanobis_threshold: 3.0
    algorithm.temporal.dynamic_reset_delta: 0.10
    algorithm.temporal.dynamic_variance_bump: 0.0225
    algorithm.frame_aggregation.robust_height_gate: 0.04
    algorithm.frame_aggregation.intra_cell_min_support_gap: 0.025
    algorithm.frame_aggregation.intra_cell_min_support_count: 3
    algorithm.frame_aggregation.edge_mix_height_diff: 0.035
    algorithm.frame_aggregation.edge_prefer_prev_support_count: 2
    algorithm.isolated_filter.radius: 1
    algorithm.isolated_filter.min_support_neighbors: 2
    algorithm.isolated_filter.support_height_diff: 0.025
    algorithm.isolated_filter.outlier_height_diff: 0.050
    algorithm.hole_fill.radius: 1
    algorithm.hole_fill.min_neighbors: 3
    algorithm.hole_fill.max_height_diff: 0.030
    algorithm.surface_smoothing.enabled: true
    algorithm.surface_smoothing.radius: 1
    algorithm.surface_smoothing.sigma_spatial: 1.1
    algorithm.surface_smoothing.sigma_height: 0.025
    algorithm.surface_smoothing.max_height_diff: 0.040
    algorithm.surface_smoothing.min_support_neighbors: 3
    algorithm.surface_smoothing.blend: 0.60
    algorithm.surface_smoothing.passes: 2
    # Debug data stays in base_link_gravity, therefore RViz can render it
    # without interpreting GridMap's column-major circular-buffer layout.
    # Final filtered/temporal height map for RViz PointCloud2 inspection.
    debug.enabled: true
    debug.pointcloud_topic: /autonomy_light/elevation_map/debug_points

# A single static mask is generated from the selected camera's fixed URDF
# transform before launch. It is injected into both elevation_mapping and
# height_map_bridge, so FOV-outside cells are exactly 0.0 in GridMap, DDS, and
# the optional --vis-height ROS mirror.
height_map_fov:
  ros__parameters:
    enabled: true
    base_frame: base_link
    camera_frames: [F_camera_link]
    # Supported: d435, d435i, d455. FOV and depth bounds are selected from
    # this model; depth_profile is inherited from the selected driver camera.
    camera_type: d435i
    # Mirrors generate_height_filter_from_urdf.py / real mapper semantics:
    # test grid-cell centers on the ground plane measured from base_link.
    reference_z: -0.48
    outside_value: 0.0

height_map_bridge:
  ros__parameters:
    input_topic: /autonomy_light/elevation_map
    base_frame: base_link_gravity
    publish_rate_hz: 50.0
    fallback.resolution: 0.05
    fallback.x_length: 3.0
    fallback.y_length: 2.0
    output.resolution: 0.10
    output.x_length: 1.80
    output.y_length: 0.80
    dds.domain_id: 1
    dds.topic: height_map
    dds.history_depth: 128
    # The F16 DDS consumer is on USB Ethernet (192.168.20.1).  Pin Cyclone
    # DDS to this local NIC instead of letting multi-NIC auto-selection choose
    # the unrelated 192.168.1.50 Ethernet interface.
    dds.network_interface: 192.168.20.2
    # Send Cyclone DDS discovery directly to the F16 as well as multicast.
    dds.peer_address: 192.168.20.1
    distance.reference_height: 0.48
    distance.min: 0.0
    distance.max: 0.75
    distance.unknown: 0.48
    floor.radius_m: 0.60
    floor.percentile: 0.20
