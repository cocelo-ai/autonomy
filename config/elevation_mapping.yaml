elevation_mapping:
  ros__parameters:
    # Sole configuration for the ETH elevation mapper: inputs, local-grid
    # geometry, fusion and cleanup live here. Shared map/base frame names are
    # bound from autonomy_light.yaml by the launcher.
    # A robot-centric circular grid: overlapping cells are retained when the
    # base moves; only the newly exposed strips become unknown.
    num_callback_threads: 4
    postprocessor_num_threads: 0
    robot_pose_with_covariance_topic: "/lio/odom"
    robot_pose_cache_size: 500
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0

    # Native fusion ROI.  This is deliberately wider than the controller
    # height-map ROI configured in autonomy_light.yaml.
    length_in_x: 3.00
    length_in_y: 2.00
    position_x: 0.0
    position_y: 0.0
    # This is the native visualization/fusion grid, independent of the
    # controller height-map contract below. Five-centimetre cells retain the
    # wall/terrain edge detail while allowing the complete native fused map
    # to be updated at the 50 Hz LiDAR cadence.
    resolution: 0.05

    # Native fused GridMap output. `elevation`, upper/lower bounds, and
    # uncertainty_range are published without a custom message conversion.
    fused_map_publishing_rate: 50.0
    min_update_rate: 50.0
    # D435 frames can reach the callback roughly 0.1–0.3 s after the
    # lower-latency LiDAR cloud.  The mapper accepts that bounded delay but
    # preserves the newest map timestamp in code.
    time_tolerance: 0.50
    # MID360's vertical precision and residual LIO pose error are centimetre
    # scale.  Do not clamp observations to an unrealistic 1 cm standard
    # deviation, otherwise normal consecutive scans are rejected as outliers.
    min_variance: 0.0004
    # Cap per-cell vertical uncertainty at 5 cm (variance 0.0025 m²).
    # The previous 20 cm cap could publish an 0.8 m four-sigma range and
    # allowed isolated Livox returns to make the elevation layer visibly jump.
    max_variance: 0.0025
    # Keep fusion local at a wall/ground boundary.  The old 5–25 cm
    # horizontal standard deviation blended the two surfaces into a broad,
    # flickering band around every wall.
    min_horizontal_variance: 0.0004
    max_horizontal_variance: 0.0100
    # Preserve the wall edge instead of spatially blending wall and floor
    # cells. The gate is only for cross-cell fusion; repeated observations
    # of an individual cell still use the measurement variance above.
    fusion_height_difference_threshold: 0.12
    mahalanobis_distance_threshold: 3.0
    # A repeated incompatible return should be treated as a small transient,
    # not grow a cell into a wall/floor blend over successive scans.
    multi_height_noise: 0.0004
    underlying_map_topic: ""

    # ETH/ANYbotics visibility cleanup removes surfaces that a newer ray
    # penetrates, preventing stale walls and overhanging artifacts from
    # remaining in the local terrain map.
    enable_visibility_cleanup: true
    enable_continuous_cleanup: false
    visibility_cleanup_rate: 10.0
    scanning_duration: 0.02
    robot_motion_map_update/covariance_scale: 1.0

    inputs: ["lidar", "d435"]
    lidar:
      type: "pointcloud"
      topic: "/lio/cloud_world"
      queue_size: 5
      publish_on_update: false
      sensor_processor:
        type: "laser"
        min_radius: 0.018
        beam_angle: 0.0006
        beam_constant: 0.0015
        apply_voxelgrid_filter: true
        # Retain one representative return per native 5 cm cell to reject
        # duplicate Livox hits before elevation fusion.
        voxelgrid_filter_size: 0.05
        # Keep terrain below the roof / upper-body envelope. This is relative
        # to base_link in the gravity-aligned map frame.
        ignore_points_above: 0.60
        ignore_points_below: -2.0

    # The D435 source is intentionally independent of LiDAR timing.  When a
    # camera is absent the subscription is idle; no merge node is required.
    d435:
      type: "pointcloud"
      topic: "/camera/camera/depth/color/points"
      queue_size: 2
      publish_on_update: false
      sensor_processor:
        type: "structured_light"
        cutoff_min_depth: 0.20
        cutoff_max_depth: 3.25
        normal_factor_a: 0.000611
        normal_factor_b: 0.003587
        normal_factor_c: 0.3515
        normal_factor_d: 0.0
        normal_factor_e: 1.0
        lateral_factor: 0.01576
        apply_voxelgrid_filter: true
        voxelgrid_filter_size: 0.03
        ignore_points_above: 0.60
        # The provisional camera extrinsic can expose invalid far-depth
        # returns below the robot.  Retain the terrain band shared with LiDAR
        # and reject those isolated -2 m outliers before fusion.
        ignore_points_below: -1.0
