live_occupancy_mapper:
  ros__parameters:

    input_topic: /lio/cloud_world
    # LIO에서 출력하는 월드 좌표계 기준 포인트클라우드.
    # Occupancy map 생성의 기본 입력.

    map_topic: /map
    # 생성된 2D occupancy grid map publish topic.

    sensor_cloud_topic: /lio/cloud_sensor
    # lidar_link 기준 원본 포인트클라우드.
    # Nav2 clearing(ray tracing)에 사용.

    obstacle_cloud_topic: /lio/cloud_sensor_obstacles
    # RANSAC ground plane 기준 높이 필터를 통과한 장애물 포인트만 출력.

    map_frame: map
    # Occupancy grid 기준 frame.

    sensor_frame: lidar_link
    # LiDAR 센서 frame.

    resolution: 0.10
    # Global occupancy map 해상도.
    # 0.10 = 10 cm/cell.

    publish_frequency: 2.0
    # /map publish 주파수 [Hz].

    # launch.sh --mapping DIRECTORY가 이 값을 실행 시점에 켜면, 종료 시
    # DIRECTORY/map.pgm와 DIRECTORY/map.yaml을 함께 저장한다.
    save_map: false
    save_map_directory: "" # save_map 사용 시 map 파일을 저장할 디렉터리.
    save_map_name: map # 저장할 occupancy map 파일의 기본 이름.

    min_obstacle_height: 0.30
    # ★ 가장 중요.
    # RANSAC으로 추정한 지면으로부터 30 cm 이상인 점만 장애물로 판단.
    #
    # lidar_link 기준 z=0.30이 아님.
    # 지면 plane에 대한 상대 높이 0.30 m임.
    #
    # 따라서 LiDAR가 지면에서 0.6 m 높이에 있어도
    # 이 값은 그대로 0.30 사용.

    max_obstacle_height: 1.50
    # RANSAC ground plane 기준으로 지면에서 1.5 m까지 장애물로 사용.
    # 그보다 높은 천장/상부 구조물은 2D navigation에서는 제외.

    ground_distance_threshold: 0.04
    # 추정된 ground plane에서 ±4 cm 정도 범위를 지면으로 간주.
    # 너무 크게 하면 낮은 구조물까지 ground로 제거될 가능성이 있음.

    max_ground_tilt_deg: 35.0
    # ground plane으로 인정할 최대 경사각.
    # 사륜사족이 경사면을 주행할 수 있기 때문에 어느 정도 크게 허용.

    min_ground_points: 100
    # ground plane으로 인정하기 위해 필요한 최소 포인트 수.

    ground_ransac_iterations: 120
    # RANSAC ground plane 추정 반복 횟수.
    # 높을수록 안정적이지만 계산량 증가.

    min_range: 0.50
    # LiDAR 기준 0.5 m 이내 포인트는 mapper에서 사용하지 않음.
    # 자기 차체/다리 등이 잡히는 것을 완화.

    max_range: 12.0
    # Mapping에 사용할 최대 센서 거리 [m].

    padding: 2.0
    # 현재 관측 범위 외곽에 추가로 확보할 map margin [m].

    expansion_chunk_size: 5.0
    # map 확장 시 한 번에 5 m 단위로 증가.
    # Nav2 StaticLayer가 scan마다 resize되는 것을 방지.

    occupied_increment: 3
    # 장애물이 관측될 때 occupancy score 증가량.

    free_decrement: 1
    # free space가 관측될 때 occupancy score 감소량.

    occupied_threshold: 3
    # score가 3 이상이면 occupied cell로 판단.

    min_score: -10
    # occupancy evidence score 최소값.

    max_score: 20
    # occupancy evidence score 최대값.

    max_cells: 4000000
    # 전체 occupancy grid 최대 cell 수.
    # 메모리 폭증 방지.


command_user_bridge:
  ros__parameters:

    input_topic: /nav2/cmd_vel
    # Nav2 controller가 출력하는 velocity command.

    output_topic: /autonomy_light/autopilot_command
    # 외부 DDS bridge가 SBC core/msg/CommandCore로 변환하는 내부 Twist topic.

    goal_topic: /goal_pose
    # RViz/goal picker가 발행하는 Goal Pose. 최초 목표 수신 전에는 command를 발행하지 않음.

    goal_status_topic: /navigate_to_pose/_action/status
    # RViz Nav2 Goal처럼 action으로 전달된 목표도 command gate를 활성화함.

    require_goal_before_publish: true
    # launch 직후 Nav2의 zero cmd가 외부 FSM으로 전달되는 것을 차단.

    publish_rate_hz: 20.0
    # command publish 주파수.

    command_timeout_sec: 0.5
    # 0.5초 동안 command가 들어오지 않으면 timeout.

controller_server:
  ros__parameters:

    controller_frequency: 20.0
    # MPPI 계산 및 cmd_vel 출력 주파수.
    # Jetson에서 우선 20 Hz로 시작하는 것을 권장.

    costmap_update_timeout: 0.30 # controller가 새 local costmap을 기다리는 최대 시간 [s].

    min_x_velocity_threshold: 0.001 # 이보다 작은 전후 odom 속도는 0으로 간주 [m/s].
    min_y_velocity_threshold: 0.001 # 이보다 작은 횡 odom 속도는 0으로 간주 [m/s].
    min_theta_velocity_threshold: 0.001 # 이보다 작은 yaw odom 속도는 0으로 간주 [rad/s].

    failure_tolerance: 0.5 # controller 실패를 허용하고 재시도할 시간 [s].

    odom_topic: /lio/odom # controller가 사용할 Super-LIO odometry 토픽.

    progress_checker_plugins: ["progress_checker"] # 로드할 progress checker 인스턴스 목록.
    goal_checker_plugins: ["goal_checker"] # 로드할 goal checker 인스턴스 목록.
    controller_plugins: ["FollowPath"] # 로드할 path-following controller 인스턴스 목록.

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" # 이동 정체 여부를 판단하는 Nav2 plugin.

      required_movement_radius: 0.25
      # 15초 안에 최소 25cm 이동해야 정상 progress로 판단.

      movement_time_allowance: 15.0 # required radius를 이동해야 하는 제한 시간 [s].

    goal_checker:
      stateful: true # 위치 도달 후에는 yaw 도달만 계속 검사할지 여부.

      plugin: "nav2_controller::SimpleGoalChecker" # 위치·자세 허용오차를 검사하는 Nav2 plugin.

      xy_goal_tolerance: 0.20
      # 목표 위치 ±20 cm.

      yaw_goal_tolerance: 0.20
      # 목표 heading ±0.20 rad.


    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController" # path를 cmd_vel로 변환하는 MPPI controller plugin.

      # ============================================================
      # MPPI optimization
      # ============================================================

      time_steps: 40
      # 한 trajectory를 몇 timestep 앞까지 예측할지.
      #
      # 아래 model_dt=0.05와 조합하면:
      # 40 × 0.05 = 2.0초
      #
      # 즉 약 2초 앞까지 robot motion을 예측.

      model_dt: 0.05
      # trajectory 한 step의 시간 간격 [s].
      # controller_frequency=20 Hz와 동일한 0.05초.

      batch_size: 1200
      # 매 cycle마다 생성해서 비교하는 후보 trajectory 개수.
      #
      # 높일수록 더 좋은 trajectory를 찾을 가능성이 있지만
      # CPU 사용량이 증가.
      #
      # Jetson에서는 우선 1000~1500 정도 권장.

      iteration_count: 1
      # MPPI optimization 반복 횟수.
      # Nav2에서는 1을 권장하고 batch_size를 늘리는 방식이 일반적. :contentReference[oaicite:1]{index=1}


      # ============================================================
      # Sampling noise
      # ============================================================

      vx_std: 0.12
      # 선속도 sampling 표준편차.
      #
      # 너무 크면 후보 trajectory가 난잡해지고 command가 흔들릴 수 있음.
      # 부드러운 움직임을 원해서 기본 예시보다 작게 시작.

      vy_std: 0.0
      # lateral velocity 사용하지 않음.

      wz_std: 0.25
      # angular velocity sampling 표준편차.
      #
      # 너무 크면 좌우 회전 명령이 자주 튈 수 있으므로
      # 우선 작게 사용.


      # ============================================================
      # Velocity limits
      # ============================================================

      vx_max: 0.40
      # 최대 전진속도 [m/s].

      vx_min: -0.10
      # MPPI가 허용하는 최소 x velocity.
      #
      # 완전히 후진을 막고 싶으면 0.0.
      # recovery 가능성을 조금 남기려면 -0.1 정도.

      vy_max: 0.0
      # 횡이동 없음.

      wz_max: 0.55
      # 최대 회전속도 [rad/s].
      # 기존 RPP보다 조금 부드럽게 시작.


      # ============================================================
      # Acceleration limits
      # ============================================================

      ax_max: 0.30
      # 최대 전진 가속도 [m/s²].

      ax_min: -0.40
      # 최대 감속도 [m/s²].
      # 음수.

      ay_max: 0.0 # 허용할 최대 횡가속도 [m/s²]; 차동구동은 0.
      ay_min: 0.0 # 허용할 최소 횡가속도 [m/s²]; 차동구동은 0.

      az_max: 0.80
      # 최대 yaw acceleration [rad/s²].
      #
      # ★ 부드러운 회전에 중요한 값.
      # 기존처럼 3~8 rad/s²를 주면 회전이 상당히 급할 수 있음.


      # ============================================================
      # MPPI weighting
      # ============================================================

      temperature: 0.3
      # trajectory cost에 대한 선택 민감도.
      #
      # 너무 낮으면 특정 trajectory 하나에 매우 강하게 몰릴 수 있고,
      # 너무 높으면 최적 trajectory 선택이 느슨해짐.
      # 기본적으로 0.3부터 시작.

      gamma: 0.015
      # control effort에 대한 weighting.
      # 일반적으로 기본값 근처에서 시작.


      # ============================================================
      # Motion model
      # ============================================================

      motion_model: "DiffDrive"
      # 현재 로봇:
      # vx + wz 기반으로 이동하고 lateral velocity가 없으므로
      # Differential Drive 모델 사용.
      #
      # Humble 계열 MPPI에서는 이 방식의 설정을 사용.


      # ============================================================
      # Command smoothing / stability
      # ============================================================

      visualize: false
      # true면 candidate trajectories를 RViz에서 볼 수 있지만
      # 계산량 및 publish 양이 상당히 증가.

      reset_period: 1.0
      # Humble MPPI에서 optimizer reset과 관련된 값.

      regenerate_noises: false
      # 매 iteration마다 noise를 새로 생성할지.
      # false가 runtime jitter 측면에서 유리.

      # 가능하면 raw control 자체에도 acceleration constraint 적용.
      clamp_raw_controls: true # smoothing 전 MPPI 제어값에도 가감속 제한을 적용.

      # Savitzky-Golay filter.
      # MPPI의 최종 control sequence를 부드럽게 함.
      sgf_order: 2


      # ============================================================
      # Critics
      # ============================================================

      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic"
        ]


      ConstraintCritic:
        enabled: true # ConstraintCritic 사용 여부.

        cost_power: 1 # ConstraintCritic cost에 적용할 지수.

        cost_weight: 4.0
        # velocity / acceleration constraint 위반 trajectory에 penalty.


      CostCritic:
        enabled: true # CostCritic 사용 여부.

        cost_power: 1 # CostCritic cost에 적용할 지수.

        cost_weight: 4.0
        # costmap cost가 높은 곳을 얼마나 강하게 피할지.
        #
        # 올리면 장애물 / inflation 영역에서 더 멀리 떨어짐.

        critical_cost: 300.0 # 충돌에 가까운 cost로 간주하는 costmap 임계값.

        consider_footprint: true
        # ★ 중요.
        #
        # robot center point가 아니라
        # 1.0 × 0.45 m 실제 footprint 전체를 collision 계산에 사용.

        collision_cost: 1000000.0
        # 실제 collision trajectory에는 매우 큰 penalty.

        near_goal_distance: 0.8
        # goal 가까이에서는 obstacle avoidance weighting을 일부 완화.

        trajectory_point_step: 2 # cost를 평가할 trajectory 점의 간격.
        # trajectory 모든 point를 검사하면 계산량이 높아지므로
        # 2 point 간격으로 cost 계산.


      GoalCritic:
        enabled: true # GoalCritic 사용 여부.

        cost_power: 1 # GoalCritic cost에 적용할 지수.

        cost_weight: 5.0
        # goal 위치로 접근하는 trajectory를 선호.

        threshold_to_consider: 1.5
        # goal 1.5 m 이내에서 본격적으로 작동.


      GoalAngleCritic:
        enabled: true # GoalAngleCritic 사용 여부.

        cost_power: 1 # GoalAngleCritic cost에 적용할 지수.

        cost_weight: 3.0
        # goal orientation을 맞추는 penalty.

        threshold_to_consider: 0.5
        # goal 0.5m 이내에서 orientation 중요도를 높임.


      PathAlignCritic:
        enabled: true # PathAlignCritic 사용 여부.

        cost_power: 1 # PathAlignCritic cost에 적용할 지수.

        cost_weight: 10.0
        # global path의 방향과 trajectory를 정렬하는 정도.
        #
        # 너무 높으면 obstacle이 있어도 global path를 고집.
        # 너무 낮으면 path에서 많이 벗어날 수 있음.

        max_path_occupancy_ratio: 0.05 # 이 비율 이상 막힌 path 구간은 정렬 기준에서 제외.

        trajectory_point_step: 4 # PathAlign cost를 평가할 trajectory 점 간격.

        threshold_to_consider: 0.5 # 이 거리 안에서는 PathAlignCritic을 비활성화 [m].

        offset_from_furthest: 20 # path의 최원 진행점에서 참조할 offset [점].

        use_path_orientations: false
        # 현재 NavFn global planner를 사용하므로 false.
        #
        # 이후 Smac Hybrid-A*로 바꾸면 true를 고려할 수 있음.
        # Nav2 문서도 feasible path orientation을 사용할 때
        # 이 옵션을 활용하도록 설명함. :contentReference[oaicite:2]{index=2}


      PathFollowCritic:
        enabled: true # PathFollowCritic 사용 여부.

        cost_power: 1 # PathFollowCritic cost에 적용할 지수.

        cost_weight: 5.0
        # global path를 따라 앞으로 progress하는 trajectory 선호.

        offset_from_furthest: 5 # 진행도 평가 기준점의 path offset [점].

        threshold_to_consider: 1.5 # 이 거리 안에서는 PathFollowCritic을 비활성화 [m].


      PathAngleCritic:
        enabled: true # PathAngleCritic 사용 여부.

        cost_power: 1 # PathAngleCritic cost에 적용할 지수.

        cost_weight: 2.0
        # robot heading과 path 방향 차이가 너무 큰 trajectory에 penalty.

        offset_from_furthest: 4 # heading 비교에 사용할 path offset [점].

        threshold_to_consider: 0.5 # 이 거리 안에서는 PathAngleCritic을 비활성화 [m].

        max_angle_to_furthest: 1.0 # 경로 방향 비교에 허용할 최대 각도 [rad].

        mode: 0
        # Forward preference.
        # 기본적으로 전진 방향을 선호.


      PreferForwardCritic:
        enabled: true # PreferForwardCritic 사용 여부.

        cost_power: 1 # PreferForwardCritic cost에 적용할 지수.

        cost_weight: 5.0
        # 후진보다 전진 trajectory를 선호.

        threshold_to_consider: 0.5 # 이 거리 안에서는 전진 선호 cost를 적용하지 않음 [m].


local_costmap:
  local_costmap:
    ros__parameters:

      update_frequency: 10.0
      # Local costmap 계산 주파수.

      publish_frequency: 5.0
      # Local costmap publish 주파수.

      global_frame: odom
      # Local costmap 기준 frame.
      # 연속성이 중요한 local navigation에서는 odom 사용.

      robot_base_frame: base_link
      # 로봇 기준 frame.

      rolling_window: true
      # 로봇 중심으로 costmap window 이동.

      width: 8
      # Local costmap x/y 전체 크기 8 m.

      height: 8 # Local costmap y 방향 길이 [m].

      resolution: 0.05
      # Local costmap은 5 cm/cell.
      #
      # 로봇 폭이 약 45 cm이므로
      # 10 cm resolution보다 collision boundary 표현이 훨씬 정확함.

      footprint: "[[0.50, 0.225], [0.50, -0.225], [-0.50, -0.225], [-0.50, 0.225]]"
      # ★ 실제 로봇 footprint.
      #
      # 전후 길이 = 1.0 m
      # 좌우 폭   = 0.45 m
      #
      # base_link가 로봇 정중앙이라고 가정:
      # 전방 +0.50 m
      # 후방 -0.50 m
      # 좌측 +0.225 m
      # 우측 -0.225 m

      footprint_padding: 0.05
      # 실제 차체 바깥으로 추가 안전거리 5 cm.
      #
      # collision 관점에서 약
      # 1.10 m × 0.55 m 영역으로 사용.

      transform_tolerance: 0.30 # local costmap이 허용할 TF 시간 오차 [s].

      always_send_full_costmap: true # 증분 update 대신 전체 local costmap을 발행.

      plugins: ["obstacle_layer", "inflation_layer"]
      # Local에서는 실시간 obstacle + inflation만 사용.

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # PointCloud2로 장애물 cost를 생성하는 layer.

        enabled: true # local ObstacleLayer 사용 여부.

        footprint_clearing_enabled: true
        # 현재 footprint 내부 obstacle cell 제거.
        # 로봇 자기 몸체가 obstacle로 남는 현상 방지.

        max_obstacle_height: 2.0
        # Layer 전체에서 사용할 z 상한.
        # 실제 obstacle 판정 높이는 mapper에서 이미 수행.

        combination_method: 1
        # 기존 costmap과 obstacle cost를 MAX 방식으로 결합.

        observation_sources: lio_marking lio_clearing # obstacle layer가 구독할 source 이름 목록.

        lio_marking:
          topic: /lio/cloud_sensor_obstacles
          # ★ mapper가 이미 지면 기준 0.30 m 이상으로 필터한 obstacle cloud.

          data_type: "PointCloud2" # lio_marking 입력 메시지 타입.

          marking: true
          # 해당 point 위치를 obstacle로 표시.

          clearing: false
          # obstacle-only cloud는 clearing에는 사용하지 않음.

          min_obstacle_height: -1.0
          # ★ 매우 중요.
          #
          # /lio/cloud_sensor_obstacles는 lidar_link 기준 좌표.
          #
          # LiDAR가 지면으로부터 약 0.6 m라면:
          #
          # lidar_link       z =  0.0
          # 30 cm 장애물     z ≈ -0.3
          # ground           z ≈ -0.6
          #
          # 따라서 여기에서 0.30을 사용하면
          # "지면에서 30 cm"가 아니라
          # "LiDAR보다 30 cm 위"만 남게 됨.
          #
          # mapper가 이미 높이 필터링했으므로
          # Nav2에서는 충분히 넓게 -1.0으로 허용.

          max_obstacle_height: 2.0
          # lidar_link보다 위쪽 포인트도 충분히 허용.
          # 실제 사용할 obstacle은 이미 mapper에서 결정됨.

          obstacle_min_range: 0.10
          # LiDAR로부터 10 cm 이내 marking point 무시.

          obstacle_max_range: 7.0
          # Local collision avoidance에는 7 m 이내 obstacle 사용.

          expected_update_rate: 0.0
          # Sensor rate timeout 검사 사용 안 함.

          observation_persistence: 0.20
          # Observation을 0.2초 유지.
          # 오래 유지하면 움직인 장애물이 ghost obstacle로 남을 수 있음.

        lio_clearing:
          topic: /lio/cloud_sensor
          # lidar_link 기준 원본 cloud.
          # Ray tracing clearing 용도.

          data_type: "PointCloud2" # lio_clearing 입력 메시지 타입.

          marking: false # 원본 cloud는 obstacle marking에 사용하지 않음.

          clearing: true
          # Sensor와 point 사이를 free space로 clearing.

          min_obstacle_height: -1.0
          # ★ LiDAR가 지면 0.6 m 위에 있으므로
          # ground z≈-0.6까지 clearing에 포함하도록 -1.0 사용.

          max_obstacle_height: 2.0
          # LiDAR 위쪽도 clearing에 충분히 포함.

          raytrace_min_range: 0.10
          # 10 cm 이내 ray tracing 무시.

          raytrace_max_range: 8.0
          # 최대 8 m까지 clearing.

          expected_update_rate: 0.0 # local lio_clearing sensor timeout 검사를 비활성화.

          observation_persistence: 0.20 # local clearing observation 유지 시간 [s].

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # 장애물 주변 안전 cost를 확장하는 layer.

        inflation_radius: 0.45
        # 장애물 주변 25 cm 범위에 추가 cost 생성.
        #
        # 실제 로봇 크기는 이미 footprint가 담당하므로
        # inflation_radius를 robot radius처럼 크게 줄 필요 없음.

        cost_scaling_factor: 5.0
        # 장애물에서 멀어질수록 cost가 감소하는 정도.
        #
        # 값 ↑ → cost가 더 빠르게 떨어짐.
        # 값 ↓ → 장애물에서 멀리까지 높은 cost가 유지됨.
        #
        # 5.0은 좁은 공간을 어느 정도 활용하면서도
        # 장애물에 너무 붙지 않도록 하는 시작값.


planner_server:
  ros__parameters:

    expected_planner_frequency: 5.0 # planner가 path를 재계산하는 기대 주파수 [Hz].

    planner_plugins: ["GridBased"] # 로드할 global planner 인스턴스 목록.

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" # Dubins 제약을 고려하는 Smac Hybrid-A* planner.

      # Costmap 자체 해상도로 검색.
      downsample_costmap: false
      downsampling_factor: 1 # downsample 사용 시 costmap 해상도 축소 비율.

      # 정확한 goal에 도달하지 못할 경우 허용 범위.
      tolerance: 0.20

      # 아직 관측되지 않은 영역도 탐색 가능.
      allow_unknown: true

      # 최대 search iteration.
      max_iterations: 1000000

      # Goal 근처에서 exact solution을 추가 탐색하는 횟수.
      max_on_approach_iterations: 1000

      # Planning에 사용할 최대 시간.
      max_planning_time: 2.0

      # Heading discretization.
      # 72개면 약 5도 간격.
      angle_quantization_bins: 72

      # 전진만 사용하는 Dubins motion model.
      motion_model_for_search: "DUBIN"

      # ★ 중요한 값.
      # 로봇이 실제로 만들 수 있는 최소 회전 반경.
      minimum_turning_radius: 0.70

      # 후진 penalty.
      reverse_penalty: 2.0

      # 방향 변경 penalty.
      change_penalty: 0.2

      # 직진하지 않고 회전하는 motion에 대한 penalty.
      non_straight_penalty: 1.15

      # Costmap obstacle cost를 얼마나 강하게 피할지.
      cost_penalty: 2.0

      # Search 중 analytic solution을 시도하는 빈도.
      analytic_expansion_ratio: 3.5

      analytic_expansion_max_length: 3.0 # analytic expansion으로 연결할 최대 길이 [m].

      # 결과 path smoothing.
      smooth_path: true


global_costmap:
  global_costmap:
    ros__parameters:

      update_frequency: 5.0
      # Global costmap 업데이트 주파수.

      publish_frequency: 2.0
      # RViz 등으로 publish하는 주파수.

      global_frame: map
      # Global navigation 기준 frame.

      robot_base_frame: base_link # global costmap에서 사용할 로봇 기준 프레임.

      rolling_window: false
      # 전체 global map 유지.

      resolution: 0.10
      # 10 cm/cell.
      # 넓은 global map이므로 local보다 낮은 해상도 사용.

      footprint: "[[0.50, 0.225], [0.50, -0.225], [-0.50, -0.225], [-0.50, 0.225]]"
      # Local costmap과 동일한 실제 footprint.
      # 1.0 m × 0.45 m.

      footprint_padding: 0.05
      # footprint 외부 5 cm safety margin.

      transform_tolerance: 0.30 # global costmap이 허용할 TF 시간 오차 [s].

      track_unknown_space: true
      # 아직 관측되지 않은 영역을 unknown으로 유지.

      always_send_full_costmap: true # 증분 update 대신 전체 global costmap을 발행.

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # ★ 기존에는 static_layer만 등록되어 있었음.
      #
      # obstacle_layer / inflation_layer 설정이 존재하더라도
      # plugins 배열에 없으면 실제로 로딩되지 않음.

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # /map occupancy grid를 읽는 static layer.

        map_topic: /map
        # live_occupancy_mapper의 occupancy map 사용.

        map_subscribe_transient_local: true
        # Nav2가 나중에 실행되어도 마지막 /map을 받을 수 있음.

        subscribe_to_updates: false
        # /map_updates 형태 incremental update는 사용하지 않음.

        transform_tolerance: 0.30 # StaticLayer가 허용할 map TF 시간 오차 [s].

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # pointcloud 기반 dynamic obstacle layer.

        enabled: true # global ObstacleLayer 사용 여부.

        footprint_clearing_enabled: true # 로봇 footprint 내부의 global obstacle을 제거.

        max_obstacle_height: 2.0
        # Layer 자체 z 범위.
        # 실제 지면 기준 obstacle filtering은 mapper가 담당.

        combination_method: 1 # 기존 global costmap과 obstacle cost를 MAX로 결합.

        observation_sources: lio_marking lio_clearing # global obstacle layer가 구독할 source 이름 목록.

        lio_marking:
          topic: /lio/cloud_sensor_obstacles # mapper가 지면 기준으로 필터한 obstacle cloud 토픽.

          data_type: "PointCloud2" # global lio_marking 입력 메시지 타입.

          marking: true # lio_marking 점을 global obstacle로 반영.

          clearing: false # obstacle-only cloud로 free-space clearing을 하지 않음.

          min_obstacle_height: -1.0
          # ★ lidar_link 기준.
          #
          # obstacle cloud는 이미 mapper에서
          # 지면 기준 30 cm 이상의 점만 남겼으므로
          # 여기서 다시 0.30 m threshold를 걸지 않음.

          max_obstacle_height: 2.0
          # lidar_link 기준 충분히 넓게 허용.

          obstacle_min_range: 0.10 # LiDAR에서 이 거리 안쪽 obstacle 점을 무시 [m].

          obstacle_max_range: 10.0
          # Global obstacle marking 최대 거리 10 m.

          expected_update_rate: 0.0 # global lio_marking sensor timeout 검사를 비활성화.

          observation_persistence: 0.50
          # Global obstacle observation을 0.5초 유지.

        lio_clearing:
          topic: /lio/cloud_sensor
          # 원본 lidar_link 기준 PointCloud.

          data_type: "PointCloud2" # global lio_clearing 입력 메시지 타입.

          marking: false # 원본 global cloud는 obstacle marking에 사용하지 않음.

          clearing: true # sensor ray를 따라 global free-space를 clearing.

          min_obstacle_height: -1.0
          # 지면 z≈-0.6을 포함하도록 -1 m까지 허용.

          max_obstacle_height: 2.0 # clearing에 허용할 lidar_link 기준 최대 높이 [m].

          raytrace_min_range: 0.10 # 이 거리 안쪽은 ray tracing하지 않음 [m].

          raytrace_max_range: 12.0
          # Global에서는 최대 12 m까지 free-space clearing.

          expected_update_rate: 0.0 # global lio_clearing sensor timeout 검사를 비활성화.

          observation_persistence: 0.50 # global clearing observation 유지 시간 [s].

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # global 장애물 주변 안전 cost 확장 layer.

        inflation_radius: 0.45
        # 장애물 외곽으로 25 cm cost 영역 형성.

        cost_scaling_factor: 5.0
        # 장애물에서 멀어질수록 cost가 비교적 빠르게 감소.


velocity_smoother:
  ros__parameters:

    smoothing_frequency: 30.0
    # Velocity smoothing 실행 주파수.

    scale_velocities: false
    # 각 velocity component를 독립적으로 limit.

    feedback: "OPEN_LOOP"
    # 실제 odometry feedback 대신 이전 command를 기준으로 smoothing.

    max_velocity: [0.50, 0.0, 0.5]
    # [linear_x, linear_y, angular_z]
    #
    # 최대 전진       : 0.50 m/s
    # lateral         : 사용 안 함
    # 최대 yaw 회전   : 0.75 rad/s

    min_velocity: [-0.20, 0.0, -0.75]
    # 최대 후진       : 0.20 m/s
    # 최대 반대 yaw   : -0.75 rad/s

    max_accel: [0.2, 0.0, 0.2]
    # 최대 가속도:
    # x   = 0.40 m/s²
    # yaw = 3.0 rad/s²

    max_decel: [-0.2, 0.0, -0.2]
    # 최대 감속도:
    # x   = -0.55 m/s²
    # yaw = -4.0 rad/s²

    odom_topic: /lio/odom # velocity smoothing에 사용할 Super-LIO odometry 토픽.

    odom_duration: 0.10
    # Odom velocity 계산 시간 window.

    deadband_velocity: [0.01, 0.0, 0.01]
    # 이보다 작은 command는 0으로 처리.

    velocity_timeout: 0.50
    # 0.5초 동안 새 command가 없으면 정지.


behavior_server:
  ros__parameters:

    local_costmap_topic: local_costmap/costmap_raw
    # Recovery behavior collision check에 사용할 local costmap.

    global_costmap_topic: global_costmap/costmap_raw # behavior collision check용 global costmap 토픽.

    local_footprint_topic: local_costmap/published_footprint # behavior server가 구독할 local footprint 토픽.

    global_footprint_topic: global_costmap/published_footprint # behavior server가 구독할 global footprint 토픽.

    cycle_frequency: 10.0
    # Behavior 실행 주파수.

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] # 로드할 recovery behavior 인스턴스 목록.

    spin:
      plugin: "nav2_behaviors/Spin"
      # 제자리 회전 recovery.

    backup:
      plugin: "nav2_behaviors/BackUp"
      # 후진 recovery.

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      # 지정 heading 방향으로 이동.

    wait:
      plugin: "nav2_behaviors/Wait"
      # 일정 시간 대기.

    local_frame: odom # behavior collision check의 local 기준 프레임.

    global_frame: map # behavior가 참조하는 global 기준 프레임.

    robot_base_frame: base_link # behavior가 사용할 로봇 기준 프레임.

    transform_tolerance: 0.30 # behavior server가 허용할 TF 시간 오차 [s].

    simulate_ahead_time: 2.5
    # Recovery command를 실행했을 때
    # 최대 2.5초 앞의 collision을 미리 검사.

    max_rotational_vel: 0.65
    # Recovery spin 최대 yaw velocity.

    min_rotational_vel: 0.15
    # 너무 작은 회전 command 방지.

    rotational_acc_lim: 4.0
    # Recovery 회전 가속도 제한.


bt_navigator:
  ros__parameters:

    global_frame: map
    # Navigation 전체 global frame.

    robot_base_frame: base_link # BT navigator가 사용할 로봇 기준 프레임.

    odom_topic: /lio/odom # BT condition/action이 사용할 Super-LIO odometry 토픽.

    bt_loop_duration: 10
    # Behavior Tree 반복 주기 [ms].

    default_server_timeout: 20
    # BT action/service 기본 timeout [ms].

    wait_for_service_timeout: 1000
    # 필요한 server/service 대기 timeout [ms].

    navigators: ["navigate_to_pose"] # 활성화할 BT navigator 인스턴스 목록.

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" # PoseStamped goal을 실행하는 navigator plugin.
